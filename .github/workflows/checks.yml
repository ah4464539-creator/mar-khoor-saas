name: Node checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          for file in src/*.js scripts/*.js public/*.js tests/*.js; do node --check "$file"; done
      - name: Run tests
        run: npm test
