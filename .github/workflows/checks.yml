name: Node checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: test-root-password
          MARIADB_DATABASE: markhoor_test
          MARIADB_USER: markhoor_test
          MARIADB_PASSWORD: test-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_USER: markhoor_test
      DB_PASSWORD: test-password
      DB_NAME: markhoor_test
      DB_INTEGRATION_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Syntax check
        run: |
          for file in src/*.js scripts/*.js public/*.js tests/*.js; do node --check "$file"; done
      - name: Apply MariaDB schema
        run: npm run migrate
      - name: Run automated tests
        run: node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=test-results.xml
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: node-test-results
          path: test-results.xml
          if-no-files-found: warn
