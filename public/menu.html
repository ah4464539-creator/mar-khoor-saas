<!doctype html>
<html lang="en">
<head>
  <link rel="icon" href="data:,"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Restaurant menu</title><link rel="stylesheet" href="/styles.css?v=customer-menu-2">
</head>
<body class="storefront">
<main class="workspace customer">
<section class="storefront-banner" aria-label="Restaurant">
<h1 id="store-name">Restaurant menu</h1>
</section>
<nav class="customer-actions" aria-label="Order activity">
<a id="customer-track" href="/orders.html#orders">Track order</a>
<a id="customer-orders" href="/orders.html#orders">Order history</a>
<a id="customer-refunds" href="/orders.html#refunds">Refunds</a>
</nav>
<div class="storefront-content">
<section class="menu-catalog" aria-label="Menu items">
<label for="menu-search" id="search-label" hidden>Search this menu <input type="search" id="menu-search" placeholder="Search by item or description">
</label>
<p id="status" class="muted" role="status">
</p>
<div id="menu" class="menu-grid">
</div>
</section>
<section class="panel cart-panel" id="checkout" hidden>
<h2>Your order</h2>
<div id="cart">
</div>
<p class="cart-total"><strong>Subtotal</strong><strong id="cart-subtotal"></strong>
</p>
<form id="order-form"><input id="customer-name" aria-label="Your name" placeholder="Your name" maxlength="160" required><button>Place order</button>
</form>
</section>
</div>
<p id="order-status" role="status">
</p>
</main>
<script type="module" src="/menu.js?v=customer-menu-3">
</script>
</body>
</html>
