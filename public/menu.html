<!doctype html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Menu | Mar-Khoor</title><link rel="stylesheet" href="/styles.css">
</head>
<body class="storefront">
<header class="top"><a class="brand" href="/">◈ MAR-KHOOR <span>AI</span></a>
<nav aria-label="Store navigation"><a href="/">Home</a><a href="/restaurant.html">Restaurant portal</a>
</nav>
</header>
<main class="workspace customer">
<section class="storefront-banner">
<h1 id="store-name">Discover the menu</h1>
<p><a id="restaurant-phone" class="button secondary" hidden></a></p>
<p class="muted">Browse currently available items from a restaurant.</p>
<form id="lookup" class="lookup"><input id="slug" aria-label="Restaurant slug" placeholder="Restaurant slug (e.g. cheema-cafe)" required><button>Load menu</button>
</form>
</section>
<div class="storefront-content">
<section class="menu-catalog" aria-label="Menu items">
<label for="menu-search" id="search-label" hidden>Search this menu <input type="search" id="menu-search" placeholder="Search by item or description">
</label>
<p id="status" class="muted" role="status">
</p>
<div id="menu" class="menu-grid">
</div>
</section>
<section class="panel cart-panel" id="checkout" hidden>
<h2>Your order</h2>
<div id="cart">
</div>
<p class="cart-total"><strong>Subtotal</strong><strong id="cart-subtotal"></strong>
</p>
<form id="order-form"><input id="customer-name" aria-label="Your name" placeholder="Your name" maxlength="160" required><button>Place order</button>
</form>
</section>
</div>
<p id="order-status" role="status">
</p>
</main>
<section class="workspace customer">
<details id="restaurant-chat" hidden>
<summary>Ask about the menu</summary>
<form id="restaurant-chat-form">
<label>Your question <input name="message" maxlength="500" required></label>
<button>Send</button>
</form>
<p id="restaurant-chat-reply" role="status"></p>
<a href="#menu" id="restaurant-chat-order" hidden>Browse menu and order</a>
</details>
</section>
<script type="module" src="/menu.js">
</script>
</body>
</html>
