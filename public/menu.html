<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<title>Restaurant menu</title>
<link rel="icon" type="image/svg+xml" href="/assets/markhor-mark-tile.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Inter:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/summit.css?v=20261122-n3">
<link rel="stylesheet" href="/public-pages.css?v=20261122-n2">
<script src="/phone-input.js?v=20261121-1" defer></script>
</head>
<body class="mk menu-page">
<header class="menu-header">
 <div class="wrap menu-header-row">
  <a class="brand" id="store-link" href="/"><span class="store-mark" id="store-mark" aria-hidden="true">R</span><b id="store-name">Restaurant menu</b></a>
  <label for="menu-search" id="search-label" class="search" hidden><span class="visually-hidden">Search this menu</span><input type="search" id="menu-search" placeholder="Search this menu"></label>
  <nav class="customer-actions" aria-label="Order activity">
   <a id="customer-track" class="btn btn-ghost btn-sm" href="/orders.html#orders">Track order</a>
   <a id="customer-orders" class="btn btn-quiet btn-sm" href="/orders.html#orders">Order history</a>
   <a id="customer-refunds" class="btn btn-quiet btn-sm" href="/orders.html#refunds">Refunds</a>
  </nav>
 </div>
 <div class="wrap"><nav id="category-nav" class="tabs category-tabs" aria-label="Menu categories" hidden></nav></div>
</header>
<main class="wrap menu-layout">
 <section class="menu-catalog" aria-label="Menu items">
  <p id="status" class="status-line" role="status"></p>
  <div id="menu" class="menu-sections"></div>
 </section>
 <aside class="card card-pad cart-panel" id="checkout" aria-labelledby="cart-title" hidden>
  <div class="card-head"><h2 id="cart-title">Your order</h2><span class="tag tag-ember" id="cart-count"></span></div>
  <div id="cart" class="cart-lines"></div>
  <form id="order-form" class="order-form">
   <div class="tabs order-type" role="radiogroup" aria-label="Order type">
    <label><input type="radio" name="order_type" value="delivery" checked><span>Delivery</span></label>
    <label><input type="radio" name="order_type" value="pickup"><span>Pickup</span></label>
   </div>
   <div class="field"><label for="customer-name">Your name</label><input class="input" id="customer-name" maxlength="160" required autocomplete="name"></div>
   <div class="field"><label for="customer-phone">Phone</label><input class="input" id="customer-phone" data-phone type="tel" inputmode="tel" maxlength="32" required autocomplete="tel" placeholder="+92 300 1234567"></div>
   <div class="field delivery-only"><label for="delivery-address">Delivery address</label><textarea class="input" id="delivery-address" maxlength="500" rows="2" autocomplete="street-address" placeholder="House, street, area, city"></textarea></div>
   <div class="field delivery-only"><label for="delivery-instructions">Instructions <span class="muted">(optional)</span></label><input class="input" id="delivery-instructions" maxlength="500" placeholder="e.g. Ring the bell twice"></div>
   <fieldset class="pay-method"><legend class="label">Payment</legend>
    <div id="pay-options" class="pay-options"><label class="pay-option"><input type="radio" name="payment_option" value="cash" checked><span id="pay-label">Cash on delivery</span></label></div>
    <div id="pay-transfer" class="pay-transfer" hidden>
     <p class="small">Send <strong id="pay-amount"></strong> to:</p>
     <dl class="pay-account"><dt>Account title</dt><dd id="pay-title"></dd><dt>Account / number</dt><dd><span id="pay-number"></span> <button type="button" class="btn btn-ghost btn-sm" id="pay-copy">Copy</button></dd></dl>
     <p class="small muted" id="pay-instructions"></p>
     <div class="field"><label for="pay-reference">Transaction ID <span class="muted">(optional now, you can add it later on the tracking page)</span></label><input class="input" id="pay-reference" maxlength="60" autocomplete="off" placeholder="e.g. 0123456789"></div>
    </div>
   </fieldset>
   <p class="cart-total"><strong>Total</strong><strong id="cart-subtotal" class="num"></strong></p>
   <button class="btn btn-primary btn-lg btn-block">Place order</button>
   <p class="hint">You get a tracking link right after ordering.</p>
  </form>
  <div id="order-status" role="status" class="order-status"></div>
 </aside>
</main>
<div class="mobile-cart-bar" id="mobile-cart-bar" hidden><a href="#checkout" class="btn btn-primary btn-lg btn-block"><span id="mobile-cart-label">View order</span><span id="mobile-cart-total" class="num"></span></a></div>
<script type="module" src="/menu.js?v=20261126-p1"></script>
</body>
</html>
