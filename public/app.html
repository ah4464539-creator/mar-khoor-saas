<body class="mk cust-app">
<header class="cust-head">
 <a class="cust-brand" href="/app"><img src="/assets/markhor-mark-tile.svg" width="32" height="32" alt=""><b>Mar<span>-</span>Khoor</b></a>
 <nav class="cust-nav"><a class="btn btn-ghost btn-sm" href="/messages">Chats</a><a class="btn btn-ghost btn-sm" href="/orders.html">Orders</a><a class="btn btn-ghost btn-sm" href="/account.html">Account</a></nav>
</header>
<main class="cust-main">
 <h1 class="cust-title">Find a business near you</h1>
 <p class="cust-sub">Restaurants, clinics, salons and hotels on Mar-Khoor. Order, book, or chat and talk with their AI assistant right here.</p>
 <form class="cust-search" role="search" id="cust-search">
  <label class="visually-hidden" for="cust-q">Search businesses</label>
  <input class="input" id="cust-q" name="q" type="search" maxlength="60" placeholder="Search a restaurant, clinic, salon or hotel" autocomplete="off">
 </form>
 <div class="cust-chips" role="group" aria-label="Category" id="cust-chips">
  <button type="button" class="cust-chip" data-category="" aria-pressed="true">All</button>
  <button type="button" class="cust-chip" data-category="restaurant" aria-pressed="false">Food</button>
  <button type="button" class="cust-chip" data-category="clinic" aria-pressed="false">Clinics</button>
  <button type="button" class="cust-chip" data-category="salon" aria-pressed="false">Salons</button>
  <button type="button" class="cust-chip" data-category="hotel" aria-pressed="false">Hotels</button>
 </div>
 <p class="cust-status" id="cust-status" role="status" aria-live="polite">Loading…</p>
 <ul class="cust-list" id="cust-list"></ul>
</main>
<footer class="cust-foot"><a href="/">For businesses: get Mar-Khoor</a> · <a href="/privacy.html">Privacy</a></footer>
</body>
</html>
